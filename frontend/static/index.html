<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WI-FI分享家 | Wi-Fi Sharing Specialist</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
<style>
  :root {
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --accent-light: #eff6ff;
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --text-primary: #1e293b;
    --text-secondary: #64748b;
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    background: linear-gradient(135deg, #1e40af 0%, #2563eb 60%, #0284c7 100%);
    color: #fff;
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 10px rgba(37, 99, 235, 0.2);
  }
  .header-brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .header-icon {
    font-size: 1.8rem;
    background: rgba(255, 255, 255, 0.2);
    padding: 0.4rem;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .header-titles h1 {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .header-titles p {
    margin: 0.15rem 0 0 0;
    font-size: 0.8rem;
    opacity: 0.9;
  }
  .header-badge {
    background: rgba(255, 255, 255, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.35);
    padding: 0.3rem 0.75rem;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .badge-dot {
    width: 8px;
    height: 8px;
    background: #4ade80;
    border-radius: 50%;
    box-shadow: 0 0 8px #4ade80;
  }

  /* Chat conversation container */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem 1rem;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .msg-row {
    display: flex;
    gap: 0.75rem;
    max-width: 85%;
  }
  .msg-row.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }
  .msg-row.agent {
    align-self: flex-start;
  }
  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 1.1rem;
  }
  .avatar.user-av {
    background: #cbd5e1;
    color: #334155;
  }
  .avatar.agent-av {
    background: linear-gradient(135deg, #2563eb, #0284c7);
    color: #fff;
    box-shadow: 0 2px 6px rgba(37, 99, 235, 0.3);
  }
  .bubble-wrap {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }
  .bubble {
    padding: 0.85rem 1.15rem;
    border-radius: 18px;
    font-size: 0.95rem;
    line-height: 1.55;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .msg-row.agent .bubble {
    background: var(--card-bg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    border-top-left-radius: 4px;
    color: var(--text-primary);
  }
  .msg-row.user .bubble {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: #fff;
    border-top-right-radius: 4px;
    box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
  }
  .bubble.rich {
    background: transparent;
    border: none;
    box-shadow: none;
    padding: 0;
    max-width: 100%;
    white-space: normal;
  }

  /* Quick example prompt chips */
  .prompts-container {
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    padding: 0.5rem 1rem 0;
  }
  .prompts-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.6rem;
  }
  @media (max-width: 680px) {
    .prompts-row {
      grid-template-columns: 1fr;
      gap: 0.4rem;
    }
  }
  .prompt-btn {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.6rem 0.85rem;
    color: var(--text-primary);
    font-size: 0.85rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    transition: all 0.2s ease;
    text-align: left;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .prompt-btn:hover {
    background: var(--accent-light);
    border-color: #93c5fd;
    color: var(--accent-dark);
    transform: translateY(-1px);
    box-shadow: 0 3px 6px rgba(37, 99, 235, 0.1);
  }
  .prompt-icon {
    font-size: 1.15rem;
    color: var(--accent);
    flex-shrink: 0;
  }

  /* Input Form */
  .footer-form {
    padding: 0.75rem 1rem 1.25rem;
    background: var(--bg);
  }
  form {
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    gap: 0.6rem;
    background: var(--card-bg);
    padding: 0.4rem 0.5rem 0.4rem 1rem;
    border: 1px solid var(--border);
    border-radius: 28px;
    box-shadow: var(--shadow);
  }
  input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 0.95rem;
    color: var(--text-primary);
  }
  input::placeholder {
    color: var(--text-secondary);
  }
  button.send-btn {
    padding: 0.6rem 1.2rem;
    border: none;
    border-radius: 22px;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.35rem;
    transition: opacity 0.2s;
  }
  button.send-btn:hover {
    opacity: 0.92;
  }

  /* Typing animation */
  .typing-indicator {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 8px;
  }
  .dot {
    width: 6px;
    height: 6px;
    background: var(--text-secondary);
    border-radius: 50%;
    animation: pulse 1.4s infinite ease-in-out both;
  }
  .dot:nth-child(1) { animation-delay: -0.32s; }
  .dot:nth-child(2) { animation-delay: -0.16s; }
  @keyframes pulse {
    0%, 80%, 100% { transform: scale(0); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* --- A2UI component styles --- */
  .a2card {
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.2rem;
    background: var(--card-bg);
    box-shadow: var(--shadow);
    max-width: 100%;
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.6rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.5; }
  .a2text.a2-h1 { font-size: 1.4rem; font-weight: 700; color: #1e3a8a; }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 700; color: #1e3a8a; }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; color: #1e293b; }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; }
  .a2text.a2-caption { font-size: 0.82rem; color: var(--text-secondary); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.6rem 0; width: 100%; }
  .a2img {
    max-width: 240px;
    width: 100%;
    border-radius: 12px;
    display: block;
    margin: 0.5rem auto;
    border: 1px solid var(--border);
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .material-symbols-outlined {
    font-family: 'Material Symbols Outlined';
    font-size: 1.35rem;
    line-height: 1;
    vertical-align: middle;
    color: var(--accent);
  }
</style>
</head>
<body>

<header>
  <div class="header-brand">
    <div class="header-icon">📶</div>
    <div class="header-titles">
      <h1>WI-FI分享家</h1>
      <p>Wi-Fi Sharing Specialist · 掃碼即連，暢通無阻</p>
    </div>
  </div>
  <div class="header-badge">
    <span class="badge-dot"></span>
    <span>A2UI 已就緒</span>
  </div>
</header>

<div id="log">
  <div class="msg-row agent">
    <div class="avatar agent-av">📶</div>
    <div class="bubble-wrap">
      <div class="bubble">您好！我是您的 <strong>WI-FI分享家</strong>。我可以為您快速查詢可用 Wi-Fi、生成相機秒連的 QR Code，或登記儲存新的熱點密碼。請問今天想分享哪一個網路？</div>
    </div>
  </div>
</div>

<div class="prompts-container">
  <div class="prompts-row">
    <button type="button" class="prompt-btn" onclick="sendPrompt('查詢目前所有可用的 Wi-Fi 熱點')">
      <span class="prompt-icon">🔍</span>
      <span>查詢可用 Wi-Fi 熱點</span>
    </button>
    <button type="button" class="prompt-btn" onclick="sendPrompt('請分享 MeetingRoom-5F 的 Wi-Fi 並生成連線 QR Code')">
      <span class="prompt-icon">📲</span>
      <span>分享 MeetingRoom-5F</span>
    </button>
    <button type="button" class="prompt-btn" onclick="sendPrompt('請幫我登記新熱點：VIP-Lounge 密碼 WelcomeVIP')">
      <span class="prompt-icon">➕</span>
      <span>登記新熱點 VIP-Lounge</span>
    </button>
  </div>
</div>

<div class="footer-form">
  <form id="form">
    <input id="input" placeholder="輸入問題、詢問 Wi-Fi 密碼或生成連線 QR Code…" autocomplete="off" autofocus>
    <button class="send-btn" type="submit">
      <span>發送</span>
      <span class="material-symbols-outlined" style="font-size:1.1rem; color:#fff;">send</span>
    </button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function bubble(who) {
  const row = el("div", "msg-row " + who);
  const av = el("div", "avatar " + (who === "user" ? "user-av" : "agent-av"), who === "user" ? "👤" : "📶");
  const wrap = el("div", "bubble-wrap");
  const b = el("div", "bubble");
  wrap.appendChild(b);
  row.appendChild(av);
  row.appendChild(wrap);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return b;
}

function showTyping() {
  const b = bubble("agent");
  const ind = el("div", "typing-indicator");
  ind.appendChild(el("span", "dot"));
  ind.appendChild(el("span", "dot"));
  ind.appendChild(el("span", "dot"));
  b.appendChild(ind);
  return b;
}

function sendPrompt(text) {
  input.value = text;
  form.dispatchEvent(new Event("submit", { cancelable: true, bubbles: true }));
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * -------------------------------------------------------------------------- */
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) {
  return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase();
}

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card");
      kids().forEach(n => d.appendChild(n));
      return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col");
      kids().forEach(n => d.appendChild(n));
      return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n));
      return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img");
      img.src = src;
      img.alt = boundStr(props.alt) || "Wi-Fi 連線 QR Code";
      return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined");
      s.textContent = iconName(boundStr(props.name) || props.name);
      return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) {
      const spec = comps[id];
      childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c));
    }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) {
    const node = buildNode(rid, comps, new Set());
    if (node) { container.appendChild(node); drew = true; }
  }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = showTyping();
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "錯誤: " + e.message;
  }
});
</script>
</body>
</html>
